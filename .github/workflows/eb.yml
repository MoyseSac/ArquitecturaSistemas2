name: Deploy to Elastic Beanstalk (Docker + ECR)

on:
  push:
    branches:
      - assignment-03

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CI-CD

    env:
      AWS_REGION: us-east-2
      EB_APP_NAME: ${{ secrets.EB_APP_NAME }}
      EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
      EB_S3_BUCKET: ${{ secrets.EB_S3_BUCKET }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      ROLE_ARN: ${{ secrets.AWS_USR_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug env presence (no secret values)
        run: |
          test -n "$ROLE_ARN" && echo "ROLE_ARN OK" || (echo "ROLE_ARN MISSING" && exit 1)
          test -n "$EB_APP_NAME" && echo "EB_APP_NAME OK" || (echo "EB_APP_NAME MISSING" && exit 1)
          test -n "$EB_ENV_NAME" && echo "EB_ENV_NAME OK" || (echo "EB_ENV_NAME MISSING" && exit 1)
          test -n "$EB_S3_BUCKET" && echo "EB_S3_BUCKET OK" || (echo "EB_S3_BUCKET MISSING" && exit 1)
          test -n "$ECR_REPOSITORY" && echo "ECR_REPOSITORY OK" || (echo "ECR_REPOSITORY MISSING" && exit 1)

      - name: Debug GitHub identity context
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Create Dockerrun.aws.json (v1)
        run: |
          cat > Dockerrun.aws.json <<'EOF'
          {
            "AWSEBDockerrunVersion": 1,
            "Image": {
              "Name": "__IMAGE_URI__",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "80"
              }
            ]
          }
          EOF
          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" Dockerrun.aws.json

      - name: Show and validate Dockerrun
        run: |
          echo "----- Dockerrun.aws.json -----"
          cat Dockerrun.aws.json
          python -m json.tool Dockerrun.aws.json > /dev/null
          echo "Dockerrun JSON OK"

      - name: Package bundle
        run: |
          zip -r deploy.zip Dockerrun.aws.json
          echo "----- ZIP contents -----"
          unzip -l deploy.zip
          echo "----- Dockerrun inside ZIP -----"
          unzip -p deploy.zip Dockerrun.aws.json

      - name: Upload bundle to S3
        env:
          S3_KEY: eb/${{ github.repository }}/deploy-${{ github.sha }}.zip
        run: |
          aws s3 cp deploy.zip "s3://$EB_S3_BUCKET/$S3_KEY"
          echo "S3_KEY=$S3_KEY" >> $GITHUB_ENV

      - name: Create EB application version
        env:
          VERSION_LABEL: ${{ github.sha }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$EB_S3_BUCKET",S3Key="$S3_KEY"

      - name: Deploy new version
        env:
          VERSION_LABEL: ${{ github.sha }}
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "$VERSION_LABEL"